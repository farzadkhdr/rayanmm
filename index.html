<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ڕایان ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Naskh Arabic', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 25%, #0f3460 50%, #533483 75%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        /* ئەنیمەیشنی ئەستێرەکان */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            animation: twinkle 1.5s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.5); }
        }

        .container {
            text-align: center;
            padding: 40px;
            position: relative;
            z-index: 2;
            max-width: 700px;
            width: 90%;
        }

        .heart-icon {
            font-size: 60px;
            animation: heartbeat 1.5s infinite ease-in-out;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px rgba(255, 0, 100, 0.8));
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.2); }
            50% { transform: scale(1.1); }
            75% { transform: scale(1.3); }
        }

        .quote-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 40px 30px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 1s ease-out;
            transition: all 0.5s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .quote-card:hover {
            border-color: rgba(255, 100, 150, 0.6);
            box-shadow: 0 25px 60px rgba(255, 0, 100, 0.3);
            transform: translateY(-5px);
        }

        .quote-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                from 0deg,
                transparent 0deg,
                rgba(255, 100, 150, 0.1) 60deg,
                transparent 120deg,
                rgba(255, 200, 100, 0.1) 180deg,
                transparent 240deg,
                rgba(100, 150, 255, 0.1) 300deg,
                transparent 360deg
            );
            animation: rotate 10s linear infinite;
            pointer-events: none;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .quote-text {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.8;
            position: relative;
            z-index: 2;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            animation: textGlow 2s infinite ease-in-out;
        }

        @keyframes textGlow {
            0%, 100% { text-shadow: 0 0 20px rgba(255, 255, 255, 0.3); }
            50% { text-shadow: 0 0 40px rgba(255, 150, 200, 0.8); }
        }

        .name-highlight {
            color: #ff6b9d;
            font-weight: bold;
            font-size: 32px;
            text-shadow: 0 0 30px rgba(255, 107, 157, 0.8);
            animation: namePulse 2s infinite ease-in-out;
            display: inline-block;
        }

        @keyframes namePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .date-badge {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #ff6b9d, #ff8e53);
            border-radius: 50px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.4);
            animation: badgePulse 2s infinite ease-in-out;
            position: relative;
            z-index: 2;
        }

        @keyframes badgePulse {
            0%, 100% { box-shadow: 0 10px 30px rgba(255, 107, 157, 0.4); }
            50% { box-shadow: 0 10px 50px rgba(255, 107, 157, 0.8); }
        }

        .sound-indicator {
            position: fixed;
            bottom: 30px;
            left: 30px;
            z-index: 100;
            animation: soundWave 1.5s infinite ease-in-out;
        }

        @keyframes soundWave {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.2); opacity: 1; }
        }

        .particle {
            position: absolute;
            bottom: -10px;
            border-radius: 50%;
            animation: floatUp 4s infinite ease-out;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) scale(0);
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            .quote-text {
                font-size: 20px;
            }
            .name-highlight {
                font-size: 24px;
            }
            .container {
                padding: 20px;
            }
            .quote-card {
                padding: 25px 20px;
            }
            .date-badge {
                font-size: 16px;
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>
    <!-- دەنگی ڤیدۆکە (شاراوە) -->
    <video id="bg-audio" style="display: none;" autoplay loop muted playsinline>
        <source src="https://raw.githubusercontent.com/farzadkhdr/rayanmm/main/v1c044g50000da47pdvog65mtpdgmb00.mp4" type="video/mp4">
    </video>

    <!-- ئەستێرەکان -->
    <div class="stars" id="stars"></div>

    <!-- نیشاندەری دەنگ -->
    <div class="sound-indicator">🎵</div>

    <div class="container" id="mainContainer">
        <div class="heart-icon">💖</div>
        
        <div class="quote-card" id="quoteCard">
            <p class="quote-text" id="quoteText">
                <span class="name-highlight">ڕایان</span>، تۆ خۆشترین بەشی ژیانمی ❤️
            </p>
            <div class="date-badge">🗓️ چاوەڕوانی مانگی ١١</div>
        </div>
    </div>

    <script>
        // وتەکان
        const quotes = [
            `<span class="name-highlight">ڕایان</span>، هەموو ڕۆژێکم بە بیرکردنەوە لە تۆ دەست پێدەکات ❤️`,
            `تۆ <span class="name-highlight">ڕایان</span>، جوانترین بەشی چیرۆکی ژیانمی ✨`,
            `هەر کاتێک دەتبینم، دڵم خێراتر لێدەدات <span class="name-highlight">ڕایان</span> 💕`,
            `<span class="name-highlight">ڕایان</span>، مانگی ١١ بەڵێنی خۆشەویستی و نزیکبوونەوەیە 🌙`,
            `لە هەموو دونیا، تەنها تۆ بەسم <span class="name-highlight">ڕایان</span> 🌹`,
            `خەونەکانم هەموویان بە تۆوە جوانترن <span class="name-highlight">ڕایان</span> 💫`,
            `<span class="name-highlight">ڕایان</span>، تۆ وەک مانگێکی پڕ لەشەوی تاریکدا درەوشاوەیتەوە 🌕`,
            `دڵم بە تۆوە بەندە <span class="name-highlight">ڕایان</span>، بۆ هەمیشە 🔒❤️`,
            `هەر وشەیەک کە دەینوسم، ناوی تۆی تێدایە <span class="name-highlight">ڕایان</span> ✍️`,
            `<span class="name-highlight">ڕایان</span>، چاوەڕوانی دیدارتن لە مانگی ١١ دڵم ڕادەکێشێت 🎯`
        ];

        let currentQuoteIndex = 0;
        let audioEnabled = false;

        // دروستکردنی ئەستێرەکان
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 2 + 's';
                star.style.animationDuration = (1 + Math.random() * 2) + 's';
                starsContainer.appendChild(star);
            }
        }

        // دروستکردنی پەڕە دڵ
        function createParticles() {
            const container = document.getElementById('mainContainer');
            const heartEmojis = ['❤️', '💕', '💖', '💗', '💓', '🌸', '✨', '💝'];
            
            setInterval(() => {
                const particle = document.createElement('span');
                particle.className = 'particle';
                particle.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
                particle.style.left = Math.random() * 100 + '%';
                particle.style.fontSize = (15 + Math.random() * 25) + 'px';
                particle.style.animationDuration = (3 + Math.random() * 3) + 's';
                container.appendChild(particle);
                
                setTimeout(() => {
                    particle.remove();
                }, 5000);
            }, 500);
        }

        // گۆڕینی وتەکان
        function changeQuote() {
            const quoteText = document.getElementById('quoteText');
            const quoteCard = document.getElementById('quoteCard');
            
            quoteCard.style.animation = 'none';
            quoteCard.offsetHeight;
            quoteCard.style.animation = 'fadeInUp 0.8s ease-out';
            
            currentQuoteIndex = (currentQuoteIndex + 1) % quotes.length;
            quoteText.innerHTML = quotes[currentQuoteIndex];
        }

        // چالاککردنی دەنگ
        function enableAudio() {
            const video = document.getElementById('bg-audio');
            if (!audioEnabled) {
                video.muted = false;
                video.volume = 0.5;
                video.play().then(() => {
                    audioEnabled = true;
                    document.querySelector('.sound-indicator').textContent = '🎵';
                }).catch(err => {
                    console.log('دەنگ نەتوانرا بلیتەوە:', err);
                });
            }
        }

        // دەستپێکردنی دەنگ لە یەکەم کلیکدا
        document.body.addEventListener('click', enableAudio);

        // گۆڕینی وتە لە هەر کلیکێکدا
        document.getElementById('quoteCard').addEventListener('click', function(e) {
            e.stopPropagation();
            changeQuote();
        });

        // ئەنیمەیشنی خۆکار بۆ گۆڕینی وتەکان
        setInterval(changeQuote, 5000);

        // دەستپێکردن
        createStars();
        createParticles();

        // لە یەکەم کلیکدا دەنگ دەست پێدەکات و وتەکان دەگۆڕدرێن
        console.log('💖 ڕایان، تۆ خۆشەویستترین کەسی ژیانمی!');
    </script>
</body>
</html>
