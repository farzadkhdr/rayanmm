<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ڕەیان ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Kurdish:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Kurdish', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* شاشەی دەستپێکردن */
        .start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: all 0.8s ease;
        }

        .start-screen.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.2);
        }

        .start-content {
            text-align: center;
            padding: 40px;
            animation: fadeInUp 1s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .start-heart {
            font-size: 80px;
            animation: bigHeartbeat 1.5s ease-in-out infinite;
        }

        @keyframes bigHeartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.2); }
            50% { transform: scale(1); }
            75% { transform: scale(1.3); }
        }

        .start-title {
            color: #ffb6c1;
            font-size: 3rem;
            margin: 20px 0;
            text-shadow: 0 0 30px rgba(255, 182, 193, 0.8);
            animation: textGlow 2s ease-in-out infinite;
        }

        @keyframes textGlow {
            0%, 100% {
                text-shadow: 0 0 30px rgba(255, 182, 193, 0.8);
            }
            50% {
                text-shadow: 0 0 50px rgba(255, 182, 193, 1),
                             0 0 80px rgba(255, 105, 180, 0.6);
            }
        }

        .start-subtitle {
            color: #ffd1dc;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .start-button {
            padding: 20px 50px;
            font-size: 1.5rem;
            font-family: 'Noto Kurdish', sans-serif;
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 40px rgba(255, 105, 180, 0.5);
            animation: buttonPulse 2s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }

        .start-button::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        @keyframes buttonPulse {
            0%, 100% {
                box-shadow: 0 10px 40px rgba(255, 105, 180, 0.5);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 15px 50px rgba(255, 105, 180, 0.8);
                transform: scale(1.05);
            }
        }

        .start-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 60px rgba(255, 105, 180, 0.8);
        }

        .start-button:active {
            transform: translateY(-1px);
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.6);
        }

        /* ناوەڕۆکی سەرەکی */
        .hearts-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .heart-particle {
            position: absolute;
            animation: floatUp linear infinite;
            opacity: 0;
            font-size: 20px;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-10vh) scale(1) rotate(360deg);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            opacity: 0;
            transition: all 1s ease;
        }

        .container.visible {
            opacity: 1;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            padding: 35px 25px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), 
                        0 0 80px rgba(255, 105, 180, 0.15);
            animation: cardGlow 3s ease-in-out infinite;
        }

        @keyframes cardGlow {
            0%, 100% {
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), 
                            0 0 80px rgba(255, 105, 180, 0.15);
            }
            50% {
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), 
                            0 0 120px rgba(255, 105, 180, 0.3);
            }
        }

        .image-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 25px;
        }

        .main-image {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(255, 105, 180, 0.6);
            box-shadow: 0 0 40px rgba(255, 105, 180, 0.4),
                        0 0 80px rgba(255, 105, 180, 0.2);
            animation: imagePulse 2s ease-in-out infinite;
            transition: all 0.5s ease;
        }

        @keyframes imagePulse {
            0%, 100% {
                box-shadow: 0 0 40px rgba(255, 105, 180, 0.4),
                            0 0 80px rgba(255, 105, 180, 0.2);
            }
            50% {
                box-shadow: 0 0 60px rgba(255, 105, 180, 0.7),
                            0 0 120px rgba(255, 105, 180, 0.4);
            }
        }

        .love-ring {
            position: absolute;
            top: -12px;
            left: -12px;
            width: calc(100% + 24px);
            height: calc(100% + 24px);
            border-radius: 50%;
            border: 2px dashed rgba(255, 105, 180, 0.5);
            animation: rotate 10s linear infinite;
        }

        .love-ring-2 {
            position: absolute;
            top: -25px;
            left: -25px;
            width: calc(100% + 50px);
            height: calc(100% + 50px);
            border-radius: 50%;
            border: 1px solid rgba(255, 192, 203, 0.3);
            animation: rotate 15s linear infinite reverse;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .heart-icon {
            position: absolute;
            bottom: 5px;
            right: 5px;
            font-size: 30px;
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.2); }
            50% { transform: scale(1); }
            75% { transform: scale(1.3); }
        }

        h1 {
            color: #ffb6c1;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 182, 193, 0.6);
            animation: textGlow 2s ease-in-out infinite;
        }

        .message-box {
            margin-top: 20px;
            padding: 20px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 182, 193, 0.3);
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .romantic-message {
            color: #ffd1dc;
            font-size: 1.2rem;
            line-height: 1.8;
            opacity: 0;
            transition: opacity 1s ease;
            text-shadow: 0 0 15px rgba(255, 209, 220, 0.5);
        }

        .romantic-message.active {
            opacity: 1;
            animation: messageAppear 1s ease forwards;
        }

        @keyframes messageAppear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .music-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            margin-top: 15px;
            height: 20px;
        }

        .music-bar {
            width: 4px;
            height: 15px;
            background: linear-gradient(180deg, #ffb6c1, #ff69b4);
            border-radius: 2px;
            animation: musicBar 0.8s ease-in-out infinite;
        }

        .music-bar:nth-child(1) { animation-delay: 0s; }
        .music-bar:nth-child(2) { animation-delay: 0.15s; }
        .music-bar:nth-child(3) { animation-delay: 0.3s; }
        .music-bar:nth-child(4) { animation-delay: 0.45s; }
        .music-bar:nth-child(5) { animation-delay: 0.6s; }
        .music-bar:nth-child(6) { animation-delay: 0.75s; }
        .music-bar:nth-child(7) { animation-delay: 0.9s; }

        @keyframes musicBar {
            0%, 100% { height: 5px; }
            50% { height: 25px; }
        }

        .music-status {
            color: #ffb6c1;
            font-size: 0.9rem;
            margin-top: 10px;
            padding: 10px;
            border-radius: 10px;
        }

        @media (max-width: 480px) {
            .start-title {
                font-size: 2rem;
            }
            .start-button {
                padding: 15px 35px;
                font-size: 1.2rem;
            }
            .main-image {
                width: 180px;
                height: 180px;
            }
            h1 {
                font-size: 1.8rem;
            }
            .romantic-message {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- شاشەی دەستپێکردن -->
    <div class="start-screen" id="startScreen">
        <div class="start-content">
            <div class="start-heart">❤️</div>
            <h1 class="start-title">ڕەیان</h1>
            <p class="start-subtitle">بۆ دەستپێکردنی ئەزموونە ڕۆمانسییەکە کلیک بکە</p>
            <button class="start-button" id="startButton">
                💕 دەستپێکردن 💕
            </button>
        </div>
    </div>

    <!-- دڵی باکگراوند -->
    <div class="hearts-bg" id="heartsBg"></div>

    <!-- کۆنتەینەری سەرەکی -->
    <div class="container" id="mainContainer">
        <div class="card">
            <!-- وێنە -->
            <div class="image-wrapper">
                <div class="love-ring"></div>
                <div class="love-ring-2"></div>
                <img 
                    src="https://raw.githubusercontent.com/farzadkhdr/rayanmm/main/IMG_9324.jpeg" 
                    alt="ڕەیان" 
                    class="main-image"
                    crossorigin="anonymous"
                >
                <span class="heart-icon">❤️</span>
            </div>

            <!-- ناو -->
            <h1>ڕەیان ❤️</h1>

            <!-- پەیامی ڕۆمانسی -->
            <div class="message-box">
                <p class="romantic-message active" id="message"></p>
            </div>

            <!-- ئاماژەی مۆسیقا -->
            <div class="music-indicator">
                <div class="music-bar"></div>
                <div class="music-bar"></div>
                <div class="music-bar"></div>
                <div class="music-bar"></div>
                <div class="music-bar"></div>
                <div class="music-bar"></div>
                <div class="music-bar"></div>
            </div>

            <!-- دۆخی مۆسیقا -->
            <p class="music-status" id="musicStatus">🎵 مۆسیقا لە کاردایە...</p>
        </div>
    </div>

    <!-- دەنگی شاراوە -->
    <audio id="bgMusic" loop preload="auto">
        <source src="https://github.com/farzadkhdr/rayanmm/raw/main/v1c044g50000da47pdvog65mtpdgmb00.mov" type="video/quicktime">
        <source src="https://github.com/farzadkhdr/rayanmm/raw/main/v1c044g50000da47pdvog65mtpdgmb00.mov" type="audio/mp4">
        <source src="https://github.com/farzadkhdr/rayanmm/raw/main/v1c044g50000da47pdvog65mtpdgmb00.mov" type="audio/mpeg">
    </audio>

    <script>
        // لیستی پەیامە ڕۆمانسییەکان - یەکەم پەیام گۆڕدراوە
        const romanticMessages = [
            "ڕەیان، تۆ باشترین کەسی ژیانمی ❤️",
            "هەر کاتێک دەتبینم، دڵم خێراتر لێدەدات 💕",
            "تۆ وەک ئەستێرەیەکی بە ئاسمانی ژیانمدا درەوشاوەیە ✨",
            "جوانییەکەت وەک گوڵێکی بەهارە، هەموو ساتێک گەشاوەتر دەبیت 🌸",
            "ڕەیان، ناوت لە دڵمدا نەخشێنراوە بۆ هەمیشە 💖",
            "تۆ هۆکاری زەردەخەنەی منیت لە هەموو ڕۆژێکدا 😊",
            "خۆشەویستی من بۆ تۆ وەک دەریایە، بێ کۆتایی و قوڵە 🌊",
            "هەر شتێک لە تۆدا جوانە، لە ناوەوە و دەرەوە 💝",
            "تۆ تەنها کەسی منی، ئەمڕۆ و سبەینێ و هەمیشە 💑",
            "ڕەیان، تۆ واتای ژیانم دەگۆڕیت بۆ جوانترین شت 🦋",
            "لەگەڵ تۆدا هەموو ساتێک جادوویە، هەموو چرکەیەک خۆشەویستییە ✨",
            "تۆ وەک ڕۆژێکی پڕ لە خۆر، گەرمی دەبەخشیتە دڵم ☀️",
            "هەر وشەیەک لە دەمتەوە وەک مۆسیقایە بۆ گوێم 🎵",
            "ڕەیان، تۆ جوانترین هەڵبژاردەی ژیانمی ❤️",
            "تۆ دڵم دەبەیتە بەهەشتێک لە خۆشەویستی 💒",
            "من و تۆ... جوانترین چیرۆکی خۆشەویستین 📖",
            "هەر هەناسەیەکم بۆ تۆ دەبێت، هەر لێدانێکی دڵم بۆ تۆیە 💓",
            "ڕەیان، تۆ ئەو کەسەی کە چاوەڕوانی تۆ بووم بە درێژایی ژیانم 🌟",
            "تۆ وەک پەڵەیەکی جوانیت لە ژیانمدا کە ناتوانم بەبێ تۆ ژیاوم 🌺",
            "خۆشەویستی من بۆ تۆ لە هەموو زمانێک بەرزترە ❤️🔥"
        ];

        let messageIndex = 0;
        const messageElement = document.getElementById('message');
        const audio = document.getElementById('bgMusic');
        const musicStatus = document.getElementById('musicStatus');
        const startScreen = document.getElementById('startScreen');
        const startButton = document.getElementById('startButton');
        const mainContainer = document.getElementById('mainContainer');
        let isMusicPlaying = false;

        // گۆڕینی پەیامەکان
        function changeMessage() {
            messageElement.classList.remove('active');
            
            setTimeout(() => {
                messageElement.textContent = romanticMessages[messageIndex];
                messageElement.classList.add('active');
                messageIndex = (messageIndex + 1) % romanticMessages.length;
            }, 500);
        }

        // دەستپێکردنی گۆڕینی پەیامەکان دوای دەستپێکردن
        function startMessageRotation() {
            changeMessage();
            setInterval(changeMessage, 4000);
        }

        // دروستکردنی دڵی باکگراوند
        function createHearts() {
            const heartsBg = document.getElementById('heartsBg');
            const heartSymbols = ['❤️', '💕', '💗', '💖', '💓', '🩷'];
            
            setInterval(() => {
                const heart = document.createElement('span');
                heart.classList.add('heart-particle');
                heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDuration = (Math.random() * 5 + 5) + 's';
                heart.style.fontSize = (Math.random() * 15 + 10) + 'px';
                heartsBg.appendChild(heart);
                
                setTimeout(() => {
                    heart.remove();
                }, 10000);
            }, 500);
        }

        // دەستپێکردنی دڵەکان
        createHearts();

        // فەنکشنی دەستپێکردنی مۆسیقا
        function startMusic() {
            if (isMusicPlaying) return;
            
            console.log('دەستپێکردنی مۆسیقا...');
            
            audio.play().then(() => {
                isMusicPlaying = true;
                musicStatus.textContent = '🎵 مۆسیقا لە کاردایە...';
                musicStatus.style.color = '#ffb6c1';
                console.log('مۆسیقا بە سەرکەوتوویی دەستی پێکرد');
            }).catch(err => {
                console.error('هەڵە لە دەستپێکردنی مۆسیقا:', err);
                
                // هەوڵی دووەم
                audio.muted = true;
                audio.play().then(() => {
                    setTimeout(() => {
                        audio.muted = false;
                        isMusicPlaying = true;
                        musicStatus.textContent = '🎵 مۆسیقا لە کاردایە...';
                        musicStatus.style.color = '#ffb6c1';
                        console.log('مۆسیقا بە mute دەستی پێکرد');
                    }, 100);
                }).catch(err2 => {
                    console.error('هەڵەی دووەم:', err2);
                    musicStatus.textContent = '❌ ناتوانرێت مۆسیقا بخرێتە کار - تکایە فایلەکە بگۆڕە بۆ MP3';
                    musicStatus.style.color = '#ff6b6b';
                });
            });
        }

        // فەنکشنی دەستپێکردنی هەموو شتێک
        function startEverything() {
            // دەستپێکردنی مۆسیقا
            startMusic();
            
            // لابردنی شاشەی دەستپێکردن
            startScreen.classList.add('hidden');
            
            // پیشاندانی ناوەڕۆکی سەرەکی
            setTimeout(() => {
                mainContainer.classList.add('visible');
                // دەستپێکردنی گۆڕینی پەیامەکان
                startMessageRotation();
            }, 500);
            
            // لابردنی شاشەی دەستپێکردن لە دوای 1 چرکە
            setTimeout(() => {
                startScreen.style.display = 'none';
            }, 1000);
        }

        // کلیک لەسەر دوگمەی دەستپێکردن
        startButton.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            startEverything();
        });

        // چاودێری کردنی دۆخی مۆسیقا
        audio.addEventListener('playing', function() {
            isMusicPlaying = true;
            musicStatus.textContent = '🎵 مۆسیقا لە کاردایە...';
            musicStatus.style.color = '#ffb6c1';
        });

        audio.addEventListener('error', function(e) {
            console.error('هەڵەی بارکردنی دەنگ:', e);
            musicStatus.textContent = '❌ هەڵەیەک لە بارکردنی فایلەکەدا ڕوویدا - فایلەکە بگۆڕە بۆ MP3';
            musicStatus.style.color = '#ff6b6b';
        });

        console.log('پەڕە بارکرا، چاوەڕوانی کلیکی بەکارهێنەر...');
    </script>
</body>
</html>
