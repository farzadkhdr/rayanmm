<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رەیان - وتە جوانەکان</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Kurdish:wght@400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Kurdish', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        
        /* ئەستێرەکان */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        
        .container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        
        .image-container {
            width: 200px;
            height: 200px;
            margin: 0 auto 30px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            animation: glow 3s infinite;
        }
        
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.4); }
            50% { box-shadow: 0 0 50px rgba(255, 215, 0, 0.8); }
        }
        
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .heart-icon {
            font-size: 50px;
            margin: 20px 0;
            animation: heartbeat 1.5s infinite;
        }
        
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.2); }
            50% { transform: scale(1.1); }
            75% { transform: scale(1.15); }
        }
        
        .quote-box {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 30px;
            margin: 20px 0;
            position: relative;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .quote-text {
            font-size: 24px;
            color: white;
            line-height: 1.8;
            font-weight: 700;
            transition: all 0.5s ease;
        }
        
        .rayan-name {
            color: #ffd700;
            font-size: 32px;
            font-weight: 900;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            display: inline-block;
            animation: shine 2s infinite;
        }
        
        @keyframes shine {
            0%, 100% { text-shadow: 0 0 10px #ffd700, 0 0 20px #ffd700; }
            50% { text-shadow: 0 0 20px #ffd700, 0 0 40px #ffd700, 0 0 60px #ffd700; }
        }
        
        .btn {
            background: linear-gradient(45deg, #ffd700, #ff8c00);
            color: #333;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Noto Kurdish', sans-serif;
            transition: all 0.3s ease;
            margin: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        /* کۆنترۆڵی دەنگ */
        .sound-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
        }
        
        .sound-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Noto Kurdish', sans-serif;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        
        .sound-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        /* دیزاینی بەفر */
        .snowflake {
            position: fixed;
            top: -10px;
            color: white;
            font-size: 20px;
            animation: fall linear infinite;
            pointer-events: none;
            z-index: 1;
            opacity: 0.7;
        }
        
        @keyframes fall {
            to {
                transform: translateY(100vh);
            }
        }
        
        .hidden-video {
            display: none;
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
                margin: 10px;
            }
            
            .quote-text {
                font-size: 18px;
            }
            
            .rayan-name {
                font-size: 24px;
            }
            
            .image-container {
                width: 150px;
                height: 150px;
            }
        }
    </style>
</head>
<body>
    <!-- ڤیدیۆی شاراوە بۆ دەنگ -->
    <video class="hidden-video" id="bg-audio" loop>
        <source src="https://github.com/farzadkhdr/rayanmm/blob/main/v1c044g50000da47pdvog65mtpdgmb00.mp4" type="video/mp4">
    </video>
    
    <div class="stars" id="stars"></div>
    
    <div class="container">
        <div class="image-container">
            <img src="https://github.com/farzadkhdr/rayanmm/blob/main/IMG_9324.jpeg" alt="رەیان">
        </div>
        
        <div class="heart-icon">❤️</div>
        
        <div class="quote-box">
            <div class="quote-text" id="quote-text">
                سڵاو <span class="rayan-name">رەیان</span>! ❤️
            </div>
        </div>
        
        <div>
            <button class="btn" onclick="showNextQuote()">وتەی داهاتوو 🔄</button>
            <button class="btn" onclick="startProposal()">پێشنیارە تایبەتەکە 💍</button>
        </div>
    </div>
    
    <div class="sound-control">
        <button class="sound-btn" onclick="toggleSound()">🔊 دەنگ</button>
    </div>
    
    <script>
        const quotes = [
            `ئەی <span class="rayan-name">رەیان</span>، تۆ وەک ئەستێرەیەکی درەوشاوە لە ئاسمانی ژیانمدا ✨`,
            `<span class="rayan-name">رەیان</span>، هەموو ڕۆژێک لەگەڵ تۆ وەک خەونێکی جوانە 💫`,
            `جوانی ناوی <span class="rayan-name">رەیان</span> وەک جوانی ڕوخساری تۆیە 🌹`,
            `ئەی <span class="rayan-name">رەیان</span>ی دلنیازم، تۆ جوانترین بەشی ژیانمی ❤️`,
            `<span class="rayan-name">رەیان</span>، دەستم بگرە و با پێکەوە ژیانێکی جوان دروست بکەین 🤝`,
            `هەر کاتێک ناوی <span class="rayan-name">رەیان</span> دەبیسم، دڵم لە شادی دەتەکێت 💖`,
            `ئەی <span class="rayan-name">رەیان</span>، تۆ گوڵێکی جوانی لە باخچەی ژیانمدا 🌸`
        ];
        
        let currentQuoteIndex = 0;
        let audioInitialized = false;
        
        // دروستکردنی ئەستێرەکان
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 2 + 's';
                starsContainer.appendChild(star);
            }
        }
        
        // دروستکردنی بەفر
        function createSnowflakes() {
            setInterval(() => {
                const snowflake = document.createElement('div');
                snowflake.className = 'snowflake';
                snowflake.innerHTML = '❄';
                snowflake.style.left = Math.random() * 100 + '%';
                snowflake.style.animationDuration = Math.random() * 3 + 2 + 's';
                snowflake.style.fontSize = Math.random() * 15 + 10 + 'px';
                document.body.appendChild(snowflake);
                
                setTimeout(() => {
                    snowflake.remove();
                }, 5000);
            }, 500);
        }
        
        // گۆڕینی وتەکان
        function showNextQuote() {
            currentQuoteIndex = (currentQuoteIndex + 1) % quotes.length;
            const quoteText = document.getElementById('quote-text');
            quoteText.style.opacity = '0';
            
            setTimeout(() => {
                quoteText.innerHTML = quotes[currentQuoteIndex];
                quoteText.style.opacity = '1';
            }, 300);
        }
        
        // دەستپێکردنی پێشنیارە تایبەتەکە
        function startProposal() {
            const proposalQuotes = [
                `ئەی <span class="rayan-name">رەیان</span>ی خۆشەویستم... 🌹`,
                `لەو کاتەوەی ناسیوتمەت، ژیانم ڕەنگێکی تری وەرگرتووە 💕`,
                `ئەی <span class="rayan-name">رەیان</span>، دەزانم مانگی ١١ دێیت بۆ خوازبینی... 💍`,
                `دەمەوێت بڵێم کە تۆ باشترین هەڵبژاردەی ژیانمی ❤️`,
                `ئەی <span class="rayan-name">رەیان</span>، ئایا دەبیتە هاوسەری من؟ 💑`,
                `بە هەموو دڵ و گیانمەوە چاوەڕێت دەکەم <span class="rayan-name">رەیان</span> 💖`
            ];
            
            let index = 0;
            const quoteText = document.getElementById('quote-text');
            
            function showProposalQuote() {
                if (index < proposalQuotes.length) {
                    quoteText.style.opacity = '0';
                    
                    setTimeout(() => {
                        quoteText.innerHTML = proposalQuotes[index];
                        quoteText.style.opacity = '1';
                        index++;
                        
                        setTimeout(showProposalQuote, 2500);
                    }, 300);
                }
            }
            
            showProposalQuote();
        }
        
        // کۆنترۆڵکردنی دەنگ
        function toggleSound() {
            const video = document.getElementById('bg-audio');
            
            if (!audioInitialized) {
                video.load();
                video.volume = 0.5;
                video.play().catch(e => console.log('چاوەڕوانی کلیک بکە'));
                audioInitialized = true;
            }
            
            if (video.paused) {
                video.play();
                document.querySelector('.sound-btn').innerHTML = '🔊 دەنگ';
            } else {
                video.pause();
                document.querySelector('.sound-btn').innerHTML = '🔇 بێدەنگ';
            }
        }
        
        // دەستپێکردنی دەنگ بە یەکەم کلیک
        document.addEventListener('click', function() {
            if (!audioInitialized) {
                const video = document.getElementById('bg-audio');
                video.load();
                video.volume = 0.3;
                video.play().catch(e => console.log('ناکرێت دەنگ لێبدرێت'));
                audioInitialized = true;
            }
        });
        
        // دەستپێکردن
        createStars();
        createSnowflakes();
        
        // گۆڕینی خۆکارانەی وتەکان هەر ٥ چرکە
        setInterval(showNextQuote, 5000);
    </script>
</body>
</html>
